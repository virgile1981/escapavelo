version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/frontend.Dockerfile
    container_name: escapavelo-frontend 
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - apps/frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy # Attend que le healthcheck du backend soit OK
    expose:
      - "4000"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/backend.Dockerfile
    container_name: escapavelo-backend
    environment:  
      - NODE_ENV=production
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USERNAME=escapavelo_user
      - DB_PASSWORD=vb03831s
      - DB_NAME=escapavelo
      - DB_SYNCHRONIZE=true
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/fr/trips"] # Vérifie une route de santé
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: escapavelo
      MYSQL_USER: escapavelo_user
      MYSQL_PASSWORD: vb03831s
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  mariadb_data:
