name: Unit Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files (Debug)
        run: ls -R  # This will show us exactly where package-lock.json is

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Utilise la version de ton projet
          cache: 'npm'       # Accélère les builds futurs
          cache-dependency-path: package-lock.json # GitHub now looks at the root package-lock.json
          
      - name: Install dependencies
        run: npm ci          # 'npm ci' est plus propre pour les environnements de CI

      - name: Run tests
        run: npm test        # La commande définie dans ton package.json