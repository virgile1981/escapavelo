version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/frontend.Dockerfile
    container_name: escapavelo-frontend 
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - apps/frontend/.env.production
    depends_on:
      - backend
    expose:
      - "4000"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/backend.Dockerfile
    container_name: escapavelo-backend
    environment:  
      - NODE_ENV=production
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USERNAME=escapavelo_user
      - DB_PASSWORD=vb03831s
      - DB_NAME=escapavelo
      - DB_SYNCHRONIZE=true
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    volumes:
      # Format: [chemin_sur_le_vps]:[chemin_dans_le_conteneur]
      - ./home/debian/data/escapavelo/images:/uploads
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: escapavelo
      MYSQL_USER: escapavelo_user
      MYSQL_PASSWORD: vb03831s
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro        # Partage les certificats
      - /var/www/certbot:/var/www/certbot:ro        # Pour la vérification Let's Encrypt
    restart: always
    depends_on:
      - frontend
      - backend
volumes:
  mariadb_data:
