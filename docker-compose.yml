services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/frontend.Dockerfile
    container_name: frontend 
    env_file:
      - apps/frontend/.env
    networks:
      - global_private_network
    depends_on:
      - backend
    expose:
      - "4000"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/backend.Dockerfile
    container_name: backend
    env_file:
      - apps/backend/.env
    volumes:
      # Format: [chemin_sur_le_vps]:[chemin_dans_le_conteneur]
      - images:/uploads
    networks:
      - global_private_network
    depends_on:
      - mariadb
    expose: 
    - "3000"

  mariadb:
    image: mariadb:11.8.5
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - private_backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro        # Partage les certificats
      - /var/www/certbot:/var/www/certbot:ro        # Pour la vérification Let's Encrypt
    restart: always
    networks:
      - global_private_network
    depends_on:
      - frontend
      - backend
volumes:
  mariadb_data:
  images:

networks:
  private_backend:
    name: global_private_network
    driver: bridge
