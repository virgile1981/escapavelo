name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@098935c1274a7b74f326500d41e765b2069f7063 # v5.0.0 (v6 stable)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
