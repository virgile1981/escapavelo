name: Unit Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Utilise la version de ton projet
          cache: 'npm'       # Accélère les builds futurs

      - name: Install dependencies
        run: npm ci          # 'npm ci' est plus propre pour les environnements de CI

      - name: Run tests
        run: npm test        # La commande définie dans ton package.json